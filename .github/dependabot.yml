version: 2

multi-ecosystem-groups:
  nightly-dependencies:
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: UTC
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    open-pull-requests-limit: 10
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    open-pull-requests-limit: 5
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # Covers the first FROM in Dockerfile and Dockerfile.debian: their shared Rust
  # builder image. GitHub's Docker updater does not support later FROM lines, so
  # maintainers refresh the separately pinned runtime images with the
  # `docker buildx imagetools inspect` command documented in each Dockerfile.
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    open-pull-requests-limit: 10
