name: Fuzz

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: nightly-2026-10-25
  CARGO_FUZZ_VERSION: 0.13.2
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUST_BACKTRACE: 1

jobs:
  add:
    name: Fuzz add
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install pinned cargo-fuzz
        timeout-minutes: 10
        run: |
          rustc --version --verbose
          cargo --version
          cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked
          cargo fuzz --version

      - name: Fetch locked fuzz dependencies
        run: cargo fetch --locked --manifest-path fuzz/Cargo.toml

      - name: Check harness style
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --bin add -- -D warnings
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Build instrumented harness
        timeout-minutes: 10
        run: |
          cargo fuzz build add
          git diff --exit-code -- Cargo.lock fuzz/Cargo.lock
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Run bounded campaign
        timeout-minutes: 12
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
          CAMPAIGN_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: |
          mkdir -p fuzz/corpus/add fuzz/artifacts/add
          cp fuzz/seeds/add/* fuzz/corpus/add/
          cargo fuzz run add -- \
            -max_total_time="${CAMPAIGN_SECONDS}" \
            -timeout=10 -rss_limit_mb=1024 -max_len=8 -seed=301

      - name: Retain failure reproducers and corpus
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-add-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            fuzz/artifacts/add/
            fuzz/corpus/add/
          if-no-files-found: warn
          retention-days: 30
