name: Docker

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - "Dockerfile.debian"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Read-only by default; each job requests the registry/SARIF/OIDC scopes it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ${{ vars.RUST_TEMPLATE_DOCKERHUB_NAMESPACE || 'threatflux' }}
  # GHCR is the primary registry. Docker Hub is opt-in: only the value 'true'
  # (with the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets available) logs in
  # to docker.io, pushes the same image there and signs it. Unset, 'false' or
  # any other value publishes to GHCR only and reads no Docker Hub secret.
  PUBLISH_DOCKERHUB: ${{ vars.RUST_TEMPLATE_PUBLISH_DOCKERHUB || 'false' }}
  DOCKER_BUILDKIT: 1
  BINARY_NAME: ${{ vars.RUST_TEMPLATE_BINARY_NAME || 'rust-cicd-template' }}
  BINARY_PACKAGE: ${{ vars.RUST_TEMPLATE_BINARY_PACKAGE || '' }}
  SBOM_MANIFEST_PATH: ${{ vars.RUST_TEMPLATE_SBOM_MANIFEST_PATH || 'Cargo.toml' }}
  # Friendly CLI name symlinked alongside the fixed /usr/local/bin/app entrypoint.
  CLI_NAME: ${{ vars.RUST_TEMPLATE_CLI_NAME || vars.RUST_TEMPLATE_BINARY_NAME || 'rust-cicd-template' }}
  # Space-separated extra apt packages needed to compile (e.g. "clang lld").
  EXTRA_BUILD_PACKAGES: ${{ vars.RUST_TEMPLATE_EXTRA_BUILD_PACKAGES || '' }}
  # Extra apt packages needed at runtime. Only honoured by Dockerfile.debian —
  # the distroless default has no package manager and ignores this.
  EXTRA_RUNTIME_PACKAGES: ${{ vars.RUST_TEMPLATE_EXTRA_RUNTIME_PACKAGES || '' }}
  # Advertised listening port (EXPOSE metadata only).
  APP_PORT: ${{ vars.RUST_TEMPLATE_APP_PORT || '8080' }}
  # Which Dockerfile to build: the distroless default, or the sanctioned
  # Dockerfile.debian variant for repos that need a runtime shell.
  DOCKERFILE: ${{ vars.RUST_TEMPLATE_DOCKERFILE || 'Dockerfile' }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_name: ${{ steps.lowercase.outputs.image_name }}
      # 'true' only when this run pushed to Docker Hub; the sign job then signs
      # the Docker Hub copy too. A flag rather than the image reference, since
      # a job output that contains a secret's value (the Docker Hub account
      # name can match the namespace) is dropped.
      dockerhub_enabled: ${{ steps.image_targets.outputs.dockerhub_enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lowercase image name
        id: lowercase
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Lowercase repo name
        id: dockerhub_repo
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "name=${REPO_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Detect Rust toolchain version
        id: rust_toolchain
        run: |
          set -euo pipefail
          # Plain sed keeps this working on self-hosted runners without Python 3.11+ tomllib.
          TOOLCHAIN_VERSION="$(sed -n -E 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n 1)"
          if [[ -z "${TOOLCHAIN_VERSION}" ]]; then
            echo "::error::Could not read toolchain.channel from rust-toolchain.toml"
            exit 1
          fi
          echo "Rust toolchain: ${TOOLCHAIN_VERSION}"
          echo "version=${TOOLCHAIN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Select build platforms
        id: platforms
        run: |
          echo "value=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          echo "needs_qemu=true" >> "$GITHUB_OUTPUT"

      # Apart from the Docker Hub logins, which run only when this step passes,
      # nothing reads a Docker Hub secret, and this step runs only after the
      # explicit opt-in.
      - name: Check Docker Hub credentials
        id: dockerhub_credentials
        if: github.event_name != 'pull_request' && env.PUBLISH_DOCKERHUB == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RUST_TEMPLATE_PUBLISH_DOCKERHUB is 'true' but the DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret is not available to this repository; publishing to GHCR only."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image targets
        id: image_targets
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ steps.dockerhub_repo.outputs.name }}
          DOCKERHUB_READY: ${{ steps.dockerhub_credentials.outputs.ready }}
        run: |
          set -euo pipefail
          dockerhub_enabled=false
          if [[ "${DOCKERHUB_READY}" == "true" ]]; then
            dockerhub_enabled=true
          fi
          {
            echo "images<<EOF"
            echo "${GHCR_IMAGE}"
            if [[ "${dockerhub_enabled}" == "true" ]]; then
              echo "${DOCKERHUB_IMAGE}"
            fi
            echo "EOF"
            echo "dockerhub_enabled=${dockerhub_enabled}"
          } >> "$GITHUB_OUTPUT"
          if [[ "${dockerhub_enabled}" == "true" ]]; then
            echo "Image targets: ${GHCR_IMAGE} and ${DOCKERHUB_IMAGE}"
          elif [[ "${PUBLISH_DOCKERHUB}" != "true" ]]; then
            echo "Image target: ${GHCR_IMAGE}. Docker Hub publishing is off; set the RUST_TEMPLATE_PUBLISH_DOCKERHUB variable to 'true' to opt in."
          else
            echo "Image target: ${GHCR_IMAGE}. Docker Hub publishing is on but skipped for this run (a pull request, or missing Docker Hub secrets)."
          fi

      - name: Set up QEMU
        if: steps.platforms.outputs.needs_qemu == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.image_targets.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract runtime metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image_targets.outputs.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract base image metadata
        id: base_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image_targets.outputs.images }}
          tags: |
            type=raw,value=base-rust-${{ steps.rust_toolchain.outputs.version }}
            type=raw,value=base-rust-latest,enable={{is_default_branch}}

      - name: Build base image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ env.DOCKERFILE }}
          target: rust-base
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.base_meta.outputs.tags }}
          labels: ${{ steps.base_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            CLI_NAME=${{ env.CLI_NAME }}
            EXTRA_BUILD_PACKAGES=${{ env.EXTRA_BUILD_PACKAGES }}
            EXTRA_RUNTIME_PACKAGES=${{ env.EXTRA_RUNTIME_PACKAGES }}
            APP_PORT=${{ env.APP_PORT }}

      - name: Build and export (PRs)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ env.DOCKERFILE }}
          platforms: linux/amd64
          tags: ${{ steps.lowercase.outputs.image_name }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            CLI_NAME=${{ env.CLI_NAME }}
            EXTRA_BUILD_PACKAGES=${{ env.EXTRA_BUILD_PACKAGES }}
            EXTRA_RUNTIME_PACKAGES=${{ env.EXTRA_RUNTIME_PACKAGES }}
            APP_PORT=${{ env.APP_PORT }}

      - name: Build and push runtime image (non-PR)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ env.DOCKERFILE }}
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            BINARY_PACKAGE=${{ env.BINARY_PACKAGE }}
            SBOM_MANIFEST_PATH=${{ env.SBOM_MANIFEST_PATH }}
            CLI_NAME=${{ env.CLI_NAME }}
            EXTRA_BUILD_PACKAGES=${{ env.EXTRA_BUILD_PACKAGES }}
            EXTRA_RUNTIME_PACKAGES=${{ env.EXTRA_RUNTIME_PACKAGES }}
            APP_PORT=${{ env.APP_PORT }}

      - name: Upload image artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: /tmp/image.tar
          if-no-files-found: error
          retention-days: 1

  scan:
    name: Security Scan
    needs: build
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download image (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: /tmp

      - name: Load image (PRs)
        if: github.event_name == 'pull_request'
        run: docker load -i /tmp/image.tar

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        if: github.event_name != 'pull_request'
        run: docker pull ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}:${{ steps.sha.outputs.short }}

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ github.event_name == 'pull_request' && format('{0}:scan', needs.build.outputs.image_name) || format('{0}/{1}:{2}', env.REGISTRY, needs.build.outputs.image_name, steps.sha.outputs.short) }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          vuln-type: os,library
          exit-code: "0"
          limit-severities-for-sarif: true

      - name: Validate Trivy report
        run: |
          test -s trivy-results.sarif
          python3 -c "import json; p=json.load(open('trivy-results.sarif')); raise SystemExit(0 if p.get('version') == '2.1.0' and p.get('runs') else 'invalid Trivy SARIF')"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
        if: always() && hashFiles('trivy-results.sarif') != ''

  sign:
    name: Sign Container
    needs: [build, scan]
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.build.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign container image
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}@${{ needs.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: 1

      # The build pushed one multi-arch index to both registries, so the GHCR
      # digest is also the Docker Hub digest. Keyless signing uses this job's
      # OIDC token, so both signatures carry the same certificate identity.
      - name: Sign Docker Hub image
        if: needs.build.outputs.dockerhub_enabled == 'true'
        env:
          COSIGN_EXPERIMENTAL: 1
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          cosign sign --yes "${DOCKERHUB_REGISTRY}/${DOCKERHUB_NAMESPACE}/${REPO_NAME,,}@${DIGEST}"

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request'
    # Read-only: pull the pushed image from GHCR and keep the SBOM as a workflow artifact.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ needs.build.outputs.image_name }}:${{ steps.sha.outputs.short }}
          artifact-name: sbom.spdx.json
          format: spdx-json
          # Release assets need contents: write; release.yml attaches the release SBOMs.
          upload-release-assets: false
