name: Auto Release

# Which token cuts the release decides how release.yml and docker.yml start:
# - GitHub App (optional): when the App ID variable and private key secret below
#   are both set, the release commit, tag and GitHub Release are written with an
#   App installation token. That tag push is an ordinary push, so the
#   `on: push: tags` triggers of release.yml and docker.yml start them, and this
#   workflow dispatches nothing (dispatching too would run each of them twice).
# - GITHUB_TOKEN (fallback, no App configured): a tag pushed with GITHUB_TOKEN
#   starts no workflows, so Create Release dispatches release.yml and docker.yml
#   for the new tag.
# The App is read from the repository variable RUST_TEMPLATE_RELEASE_APP_ID and
# secret RUST_TEMPLATE_RELEASE_APP_PRIVATE_KEY, falling back to the ThreatFlux
# organization's TF_AUTOMATION_APP_ID and TF_AUTOMATION_APP_PRIVATE_KEY. See
# docs/RELEASING.md#release-token.

# Key on the head repository too, so a fork PR whose branch is named "main"
# cannot cancel an in-progress release run for this repository's main. Dry runs
# get their own group, so a rehearsal can never cancel a real release run.
concurrency:
  group: auto-release-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["CI", "Security"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Report the version and the release steps without committing, tagging, releasing or dispatching
        required: false
        default: false
        type: boolean

# Read-only by default; only the release job gets write scopes.
permissions:
  contents: read

env:
  RUST_VERSION: 1.99.0
  RUSTUP_TOOLCHAIN: 1.99.0
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
  # GitHub App ID or client ID that cuts releases; empty means GITHUB_TOKEN.
  RELEASE_APP_ID: ${{ vars.RUST_TEMPLATE_RELEASE_APP_ID || vars.TF_AUTOMATION_APP_ID || '' }}

jobs:
  check:
    name: Check for Release
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    # workflow_run also fires for pull_request runs, including fork PRs whose
    # branch is named "main"; only react to successful pushes to this repo's main.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      actions: read
    env:
      # Step-level `if:` cannot read `secrets`, so expose only whether a key is set.
      HAS_RELEASE_APP_KEY: ${{ (secrets.RUST_TEMPLATE_RELEASE_APP_PRIVATE_KEY || secrets.TF_AUTOMATION_APP_PRIVATE_KEY) != '' }}
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      next_version: ${{ steps.version.outputs.next_version }}
      current_version: ${{ steps.version.outputs.current_version }}
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      # Check out the workflow's own commit (for workflow_run and schedule, the
      # current tip of the default branch), never the triggering run's head SHA.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine target SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TARGET_SHA="$(git rev-parse HEAD)"
          if [[ "${EVENT_NAME}" == "workflow_run" && "${TRIGGER_SHA}" != "${TARGET_SHA}" ]]; then
            # main moved on; the CI status check below only passes once the
            # new tip's own CI and Security runs have succeeded.
            echo "Triggering run was for ${TRIGGER_SHA}; evaluating main tip ${TARGET_SHA}"
          fi
          echo "sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check CI status
        id: ci_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          CI_STATUS=$(gh run list --workflow=ci.yml --branch=main --commit="$TARGET_SHA" --event=push --limit=1 --json conclusion --jq '.[0].conclusion // ""')
          SECURITY_STATUS=$(gh run list --workflow=security.yml --branch=main --commit="$TARGET_SHA" --event=push --limit=1 --json conclusion --jq '.[0].conclusion // ""')
          echo "Push run conclusions for ${TARGET_SHA}: CI '${CI_STATUS}', Security '${SECURITY_STATUS}' (empty: no push run has completed)"
          if [[ "$CI_STATUS" == "success" ]] && [[ "$SECURITY_STATUS" == "success" ]]; then
            echo "all_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_PASSED: ${{ steps.ci_status.outputs.all_passed }}
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          SINCE="${LAST_TAG:-the first commit}"
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          CHANGES=$(git log "$LAST_TAG..HEAD" --oneline --no-merges | wc -l)
          FEAT_COUNT=$(git log "$LAST_TAG..HEAD" --grep="^feat" --oneline | wc -l)
          FIX_COUNT=$(git log "$LAST_TAG..HEAD" --grep="^fix" --oneline | wc -l)
          BREAKING_BODY_COUNT=$(git log "$LAST_TAG..HEAD" --grep="BREAKING CHANGE" --oneline | wc -l)
          BREAKING_SUBJECT_COUNT=$(git log "$LAST_TAG..HEAD" --pretty=format:%s --no-merges | grep -Ec '^[[:alpha:]][[:alnum:]-]*(\([^)]+\))?!:' || true)
          BREAKING_COUNT=$((BREAKING_BODY_COUNT + BREAKING_SUBJECT_COUNT))
          echo "Commits since ${SINCE}: ${CHANGES} (feat: ${FEAT_COUNT}, fix: ${FIX_COUNT}, breaking: ${BREAKING_COUNT})"

          # What a completed-run or scheduled trigger decides for this commit.
          if [[ "${CI_PASSED}" != "true" ]]; then
            AUTOMATIC=false
            REASON="CI and Security have not both succeeded on a push of this commit"
          elif [[ $CHANGES -eq 0 ]]; then
            AUTOMATIC=false
            REASON="there are no commits since ${SINCE}"
          elif [[ $BREAKING_COUNT -gt 0 ]] || [[ $FEAT_COUNT -gt 0 ]] || [[ $FIX_COUNT -gt 0 ]]; then
            AUTOMATIC=true
            REASON="there are feat, fix or breaking commits since ${SINCE}"
          else
            AUTOMATIC=false
            REASON="no commit since ${SINCE} is a feat, fix or breaking change"
          fi

          if [[ "$AUTOMATIC" == "true" ]]; then
            DECISION="release"
          else
            DECISION="no release"
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Decision: release (manual dispatch). An automatic run would decide: ${DECISION}, because ${REASON}."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Decision: ${DECISION}, because ${REASON}."
            echo "should_release=${AUTOMATIC}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version
        id: version
        if: steps.check.outputs.should_release == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_BUMP: ${{ github.event.inputs.version_bump }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(python3 scripts/release_version.py current)"
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml version ${CURRENT_VERSION} is not MAJOR.MINOR.PATCH; release pre-release versions by hand (see docs/RELEASING.md)."
            exit 1
          fi
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            BUMP_TYPE="${REQUESTED_BUMP}"
            BUMP_SOURCE="chosen in the dispatch"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            BUMP_SOURCE="from the commits since ${LAST_TAG:-the first commit}"
            if [ -z "$LAST_TAG" ]; then
              LAST_TAG=$(git rev-list --max-parents=0 HEAD)
            fi

            BREAKING_BODY=$(git log "$LAST_TAG..HEAD" --grep="BREAKING CHANGE" --oneline | wc -l)
            BREAKING_SUBJECT=$(git log "$LAST_TAG..HEAD" --pretty=format:%s --no-merges | grep -Ec '^[[:alpha:]][[:alnum:]-]*(\([^)]+\))?!:' || true)
            BREAKING=$((BREAKING_BODY + BREAKING_SUBJECT))
            FEAT=$(git log "$LAST_TAG..HEAD" --grep="^feat" --oneline | wc -l)

            if [[ $BREAKING -gt 0 ]]; then
              BUMP_TYPE="major"
            elif [[ $FEAT -gt 0 ]]; then
              BUMP_TYPE="minor"
            else
              BUMP_TYPE="patch"
            fi
          fi

          case $BUMP_TYPE in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::Unknown version bump '${BUMP_TYPE}'"; exit 1 ;;
          esac
          NEXT_VERSION="$MAJOR.$MINOR.$PATCH"

          # Stop before the release job writes anything if the manifest is behind
          # the latest release tag: the bump would land at or below a version that
          # is already tagged, and the tag push would fail after main had moved.
          LATEST_TAG=$(git tag --list 'v[0-9]*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          if [[ -n "$LATEST_TAG" ]] && [[ "$(printf '%s\n%s\n' "$CURRENT_VERSION" "${LATEST_TAG#v}" | sort -V | tail -n 1)" != "$CURRENT_VERSION" ]]; then
            echo "::error::Cargo.toml version ${CURRENT_VERSION} is lower than the latest release tag ${LATEST_TAG}. Set the manifest version to ${LATEST_TAG#v}, then re-run."
            exit 1
          fi

          echo "Version: ${CURRENT_VERSION} -> ${NEXT_VERSION} (${BUMP_TYPE} bump ${BUMP_SOURCE})"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      # Checked before Create Release can start, and in every dry run, so a
      # half-configured App never silently falls back to GITHUB_TOKEN.
      - name: Validate GitHub App configuration
        if: env.DRY_RUN == 'true' || steps.check.outputs.should_release == 'true'
        run: |
          if [[ -n "${RELEASE_APP_ID}" ]] && [[ "${HAS_RELEASE_APP_KEY}" == "true" ]]; then
            echo "Release token: GitHub App ${RELEASE_APP_ID}"
          elif [[ -z "${RELEASE_APP_ID}" ]] && [[ "${HAS_RELEASE_APP_KEY}" != "true" ]]; then
            echo "Release token: GITHUB_TOKEN (no GitHub App configured)"
          else
            echo "::error::Set the release GitHub App ID variable and private key secret together (RUST_TEMPLATE_RELEASE_APP_ID and RUST_TEMPLATE_RELEASE_APP_PRIVATE_KEY, or TF_AUTOMATION_APP_ID and TF_AUTOMATION_APP_PRIVATE_KEY), or neither to release with GITHUB_TOKEN. App ID set: $([[ -n "${RELEASE_APP_ID}" ]] && echo yes || echo no); private key set: $([[ "${HAS_RELEASE_APP_KEY}" == "true" ]] && echo yes || echo no)."
            exit 1
          fi

      # A dry run mints the same App token a real release would, so a rehearsal
      # proves the App ID, the private key and the installation's permissions.
      # Nothing uses the token, and the action revokes it when the job ends.
      - name: Create GitHub App installation token (dry run)
        id: app_token
        if: env.DRY_RUN == 'true' && env.RELEASE_APP_ID != '' && env.HAS_RELEASE_APP_KEY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.RELEASE_APP_ID }}
          private-key: ${{ secrets.RUST_TEMPLATE_RELEASE_APP_PRIVATE_KEY || secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Report dry run
        if: env.DRY_RUN == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOULD_RELEASE: ${{ steps.check.outputs.should_release }}
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Create Release skips any target that is not the current tip of main.
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          {
            if [[ -n "${APP_SLUG}" ]]; then
              echo "Dry run: release token is the GitHub App ${APP_SLUG}; its installation token was minted with contents: write and is revoked unused."
            else
              echo "Dry run: release token is GITHUB_TOKEN; no GitHub App is configured."
            fi
            if [[ "$SHOULD_RELEASE" == "true" ]] && [[ "$MAIN_SHA" != "$TARGET_SHA" ]]; then
              echo "Dry run: would not release v${NEXT_VERSION}: ${TARGET_SHA} is not the tip of main (${MAIN_SHA}), so Create Release would skip it as stale."
            elif [[ "$SHOULD_RELEASE" == "true" ]]; then
              TAG="v${NEXT_VERSION}"
              # Bump this read-only checkout only to list the files a release would commit.
              python3 scripts/release_version.py set "$NEXT_VERSION"
              echo "Dry run: would release ${TAG} (${CURRENT_VERSION} -> ${NEXT_VERSION}) from ${TARGET_SHA}."
              if [[ -n "${APP_SLUG}" ]]; then
                echo "- next action: as ${APP_SLUG}[bot], commit \"chore: release ${TAG}\" to main, push the annotated tag ${TAG} and create its GitHub Release; the tag push starts release.yml and docker.yml, so nothing would be dispatched"
              else
                echo "- next action: commit \"chore: release ${TAG}\" to main, push the annotated tag ${TAG}, create its GitHub Release and dispatch release.yml and docker.yml for ${TAG}, because a tag pushed with GITHUB_TOKEN starts no workflows"
              fi
              git diff --name-only | while IFS= read -r file; do
                echo "- would update ${file}"
              done
              git checkout -- .
              if [[ -f Cargo.lock ]]; then
                echo "- would update Cargo.lock if cargo check changes it"
              fi
            else
              echo "Dry run: would not release ${TARGET_SHA}."
            fi
            echo "- nothing was written to the repository: no commit, tag, GitHub Release or workflow dispatch"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: Create Release
    needs: check
    # A dry run ends after the check job has reported what it would release.
    if: needs.check.outputs.should_release == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    runs-on: ${{ vars.RUST_TEMPLATE_RUNNER_UBUNTU || 'ubuntu-latest' }}
    # Both scopes are used only when no GitHub App is configured; the App token
    # carries its own permissions.
    permissions:
      # Push the release commit and tag, and create the GitHub release.
      contents: write
      # Dispatch release.yml and docker.yml for the new tag.
      actions: write
    env:
      # Step-level `if:` cannot read `secrets`, so expose only whether a key is set.
      HAS_RELEASE_APP_KEY: ${{ (secrets.RUST_TEMPLATE_RELEASE_APP_PRIVATE_KEY || secrets.TF_AUTOMATION_APP_PRIVATE_KEY) != '' }}
    steps:
      # Limited to this repository and to contents: write (the release commit,
      # the tag and the GitHub Release). The check job has already failed the
      # run if only one of the App ID and the private key is set.
      - name: Create GitHub App installation token
        id: app_token
        if: env.RELEASE_APP_ID != '' && env.HAS_RELEASE_APP_KEY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.RELEASE_APP_ID }}
          private-key: ${{ secrets.RUST_TEMPLATE_RELEASE_APP_PRIVATE_KEY || secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      # The checkout keeps this token for the release commit and tag pushes.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          ref: ${{ needs.check.outputs.target_sha }}

      - name: Configure Git
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if [[ -n "${APP_SLUG}" ]]; then
            # Author the release commit as the App's bot user.
            BOT_LOGIN="${APP_SLUG}[bot]"
            if BOT_ID="$(gh api "users/${BOT_LOGIN}" --jq .id)"; then
              BOT_EMAIL="${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com"
            else
              echo "::warning::Could not look up ${BOT_LOGIN}; committing as ${BOT_LOGIN}@users.noreply.github.com"
              BOT_EMAIL="${BOT_LOGIN}@users.noreply.github.com"
            fi
            git config user.name "${BOT_LOGIN}"
            git config user.email "${BOT_EMAIL}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
          fi
          echo "Committing as $(git config user.name) <$(git config user.email)>"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Verify active Rust compiler
        shell: bash
        run: |
          rustc --version --verbose
          cargo --version

      - name: Update version
        run: |
          VERSION="${{ needs.check.outputs.next_version }}"
          python3 scripts/release_version.py set "$VERSION"
          cargo check --workspace --all-features
        env:
          VERSION: ${{ needs.check.outputs.next_version }}

      - name: Generate changelog
        run: |
          VERSION="${{ needs.check.outputs.next_version }}"
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          printf '## Release v%s\n\n' "$VERSION" > release_notes.md
          if [ -n "$LAST_TAG" ]; then
            FEATURES=$(git log "$LAST_TAG..HEAD" --grep="^feat" --pretty=format:"- %s (%h)" --no-merges)
            if [ -n "$FEATURES" ]; then
              printf '### Features\n%s\n\n' "$FEATURES" >> release_notes.md
            fi
            FIXES=$(git log "$LAST_TAG..HEAD" --grep="^fix" --pretty=format:"- %s (%h)" --no-merges)
            if [ -n "$FIXES" ]; then
              printf '### Bug Fixes\n%s\n\n' "$FIXES" >> release_notes.md
            fi
          fi

      - name: Commit and tag
        id: publish_release_commit
        run: |
          set -euo pipefail
          VERSION="${{ needs.check.outputs.next_version }}"
          TARGET_SHA="${{ needs.check.outputs.target_sha }}"

          git fetch origin main --no-tags
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "${CURRENT_MAIN_SHA}" != "${TARGET_SHA}" ]]; then
            echo "main advanced to ${CURRENT_MAIN_SHA}; skipping stale auto-release run for ${TARGET_SHA}"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          find . -name Cargo.toml -not -path './target/*' -not -path './.git/*' -print0 | xargs -0 git add
          if [[ -f Cargo.lock ]]; then
            git add Cargo.lock
          fi
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: steps.publish_release_commit.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check.outputs.next_version }}"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Release v${VERSION}" --notes-file release_notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Release v${VERSION}" --notes-file release_notes.md
          fi

      # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so start the
      # tag-driven release (binaries, SBOM, crates.io) and container workflows here.
      # An App-pushed tag has already started them; dispatching too would run
      # each of them twice.
      - name: Dispatch release and container workflows
        if: steps.publish_release_commit.outputs.released == 'true' && steps.app_token.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.next_version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f version="$VERSION"
          gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

      - name: Report tag-triggered workflows (GitHub App)
        if: steps.publish_release_commit.outputs.released == 'true' && steps.app_token.outcome == 'success'
        env:
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          VERSION: ${{ needs.check.outputs.next_version }}
        run: |
          MESSAGE="Not dispatching release.yml or docker.yml: ${APP_SLUG}[bot] pushed v${VERSION}, and that tag push starts both through their on: push: tags triggers."
          echo "::notice title=Release workflows start from the tag push::${MESSAGE}"
          echo "${MESSAGE}" >> "$GITHUB_STEP_SUMMARY"
